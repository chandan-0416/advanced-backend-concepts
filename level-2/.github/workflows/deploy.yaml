name: deploy to ec2
on :
    push:
      branches:
         - main

jobs: 
   deploy:
      runs_on: ubuntu-latest

   steps:
    - name: checkout code
      uses: actions/setup-node@v6
    - name: deploy via ssh
      uses: appleboy/ssh-action@v1
      with:
        host: ${{secrets.SSH_HOST}}
        username: ubuntu
        key: ${{secretes.SSH_HOST}}